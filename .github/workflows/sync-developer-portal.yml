name: 'Sync: Developer portal skills'

# Copies this repo's skills into DocHubInc/dochub-developer-portal at
# public/.well-known/skills/ and opens a pull request. This repo is the
# source of truth — edit skills here, not in the portal.
#
# Commits through GitHub's API (ghcommit-action) with the OpenAPI Sync App
# token so the author is dochub-openapi-sync[bot]. That matches OpenAPI sync
# and lets auto-merge clear the portal's required-review / unattributed-commit
# rules once checks are green.

on:
  push:
    branches: [main]
    paths:
      - 'dochub-*/**'
      - 'index.json'
      - '.github/workflows/sync-developer-portal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-developer-portal-skills
  cancel-in-progress: true

env:
  PORTAL_REPO: DocHubInc/dochub-developer-portal
  SYNC_BRANCH: chore/agent-skills-sync
  SKILLS_DEST: public/.well-known/skills

jobs:
  sync:
    name: Sync skills via portal pull request
    runs-on: ubuntu-latest

    steps:
      - name: Checkout skills (source of truth)
        uses: actions/checkout@v4
        with:
          path: skills
          persist-credentials: false

      - name: Mint App token for developer portal
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SKILLS_PORTAL_SYNC_APP_ID }}
          private-key: ${{ secrets.SKILLS_PORTAL_SYNC_APP_PRIVATE_KEY }}
          owner: DocHubInc
          repositories: dochub-developer-portal
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout developer portal
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PORTAL_REPO }}
          ref: main
          path: portal
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Replace portal skill pack
        run: |
          set -euo pipefail
          dest="portal/${SKILLS_DEST}"
          rm -rf "$dest"
          mkdir -p "$dest"
          cp skills/index.json "$dest/index.json"
          for dir in skills/dochub-*/; do
            name="$(basename "$dir")"
            mkdir -p "$dest/$name"
            cp "$dir/SKILL.md" "$dest/$name/SKILL.md"
          done
          echo "Synced into $dest:"
          find "$dest" -type f | sort

      - name: Detect changes
        id: diff
        working-directory: portal
        run: |
          set -euo pipefail
          # Stage so *new* files count too — `git diff` alone ignores untracked paths
          # (portal main may not have public/.well-known/skills/ yet).
          git add -- "${SKILLS_DEST}"
          if git diff --cached --quiet -- "${SKILLS_DEST}"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Portal skills already match this repo.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            git diff --cached --stat -- "${SKILLS_DEST}"
          fi

      - name: Close a superseded sync pull request
        if: steps.diff.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ env.PORTAL_REPO }}
          BRANCH: ${{ env.SYNC_BRANCH }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            echo 'No open sync pull request to close.'
            exit 0
          fi
          gh pr close "$pr" --repo "$REPO" --delete-branch
          gh pr comment "$pr" --repo "$REPO" \
            --body 'Superseded: `public/.well-known/skills` on `main` already matches DocHubInc/dochub-agent-skills.' \
            || echo '::warning::Closed the pull request but could not leave a comment on it.'
          echo "Closed superseded pull request #$pr." >> "$GITHUB_STEP_SUMMARY"

      - name: Compose commit message
        id: message
        if: steps.diff.outputs.changed == 'true'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          short="${SOURCE_SHA:0:12}"
          echo "text=chore(skills): sync agent skills from dochub-agent-skills@${short}" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"

      # Point the sync branch at current main before committing so the PR is one
      # commit on tip of main (same pattern as OpenAPI sync).
      - name: Reset sync branch to main
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ env.PORTAL_REPO }}
          BRANCH: ${{ env.SYNC_BRANCH }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
          if gh api "repos/$REPO/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/heads/$BRANCH" -f "sha=$main_sha" -F force=true >/dev/null
            echo "Reset $BRANCH to $main_sha"
          else
            gh api -X POST "repos/$REPO/git/refs" -f "ref=refs/heads/$BRANCH" -f "sha=$main_sha" >/dev/null
            echo "Created $BRANCH at $main_sha"
          fi

      # Commits via the App token so GitHub attributes the commit to
      # dochub-openapi-sync[bot] (not github-actions[bot]). Required for the
      # portal ruleset require_extra_approval_for_unattributed_changes.
      #
      # Pinned to a commit rather than the tag: this step receives a token that
      # can write to the portal, and a tag can be repointed.
      - name: Commit skills to sync branch
        if: steps.diff.outputs.changed == 'true'
        uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        with:
          commit_message: ${{ steps.message.outputs.text }}
          repo: ${{ env.PORTAL_REPO }}
          branch: ${{ env.SYNC_BRANCH }}
          repository: portal
          file_pattern: ${{ env.SKILLS_DEST }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Open pull request and enable auto-merge
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ env.PORTAL_REPO }}
          BRANCH: ${{ env.SYNC_BRANCH }}
          TITLE: ${{ steps.message.outputs.text }}
          SHORT: ${{ steps.message.outputs.short }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          body_lines=(
            'Automated by `.github/workflows/sync-developer-portal.yml` in'
            "\`${SOURCE_REPO}\`."
            ''
            "Source: [\`${SOURCE_REPO}@${SHORT}\`](https://github.com/${SOURCE_REPO}/commit/${SOURCE_SHA})."
            ''
            'Replaces `public/.well-known/skills/` so'
            '`npx skills add https://dev.dochub.com` matches'
            '`npx skills add DocHubInc/dochub-agent-skills`.'
            ''
            'Auto-merge is enabled. After required checks pass the PR merges'
            'automatically when the sync App can bypass required reviews'
            '(same idea as OpenAPI sync).'
          )
          body="$(printf '%s\n' "${body_lines[@]}")"

          pr="$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            gh pr create --repo "$REPO" --base main --head "$BRANCH" --title "$TITLE" --body "$body"
            pr="$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
            if [ -z "$pr" ]; then
              echo "::error::Created a pull request for $BRANCH but could not read its number back."
              exit 1
            fi
          else
            echo "Reusing open pull request #$pr (branch was reset and recommitted)."
          fi

          if ! gh pr merge "$pr" --repo "$REPO" --auto --squash --delete-branch; then
            echo "::error::Could not enable auto-merge on #$pr; see the GraphQL error above."
            exit 1
          fi

          pr_url="$(gh pr view "$pr" --repo "$REPO" --json url --jq '.url')"
          {
            echo "Opened $pr_url with synced \`public/.well-known/skills\`."
            echo "Source: \`${SOURCE_REPO}@${SHORT}\`."
          } >> "$GITHUB_STEP_SUMMARY"
